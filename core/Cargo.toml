[package]
name = "sailvault-core"
version = "0.1.0"
edition = "2021"
# The Rust toolchain in the SailfishOS-5.1.0.11 target is 1.75.
rust-version = "1.75"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
aes = "0.8"
argon2 = { version = "0.5", default-features = false, features = ["alloc", "zeroize"] }
base64 = "0.22"
cbc = "0.1"
hkdf = "0.12"
hmac = "0.12"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
sha2 = "0.10"
zeroize = { version = "1.8", features = ["derive"] }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# Unwinding across the C FFI boundary is undefined behavior.
panic = "abort"
lto = true
codegen-units = 1

[profile.dev]
panic = "abort"

# KDF test vectors use production parameters; unoptimized crypto would take minutes.
[profile.dev.package."*"]
opt-level = 3
