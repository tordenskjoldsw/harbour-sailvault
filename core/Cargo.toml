[package]
name = "sailvault-core"
version = "0.1.0"
edition = "2021"
# The Rust toolchain in the SailfishOS-5.1.0.11 target is 1.75.
rust-version = "1.75"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[profile.release]
# Unwinding across the C FFI boundary is undefined behavior.
panic = "abort"
lto = true
codegen-units = 1

[profile.dev]
panic = "abort"
